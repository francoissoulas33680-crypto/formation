<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'arbre de la ferme diversifiée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#EEF2E6; --encre:#1F3A2B; --doux:#5B6E5F; --carte:#FFFFFF; --trait:#C9D3BF;
  --ciel:#CFE3EC; --feuille:#5E8C3A; --feuille2:#7FA855; --tronc:#7A4E2D; --sol:#8A5A36;
  --seve:#2F6DB5; --fruit:#B8322A; --cache:#B9C2B0; --accent:#2F6DB5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --fond:#17221B; --encre:#E6EEDF; --doux:#A9B8A8; --carte:#1F2D24; --trait:#33463A;
  --ciel:#2A4250; --feuille:#5E8C3A; --feuille2:#7FA855; --tronc:#9A6A45; --sol:#6B4529;
  --seve:#6FA4E8; --fruit:#E0574C; --cache:#3E4E43; --accent:#6FA4E8; } }
:root[data-theme="dark"]{
  --fond:#17221B; --encre:#E6EEDF; --doux:#A9B8A8; --carte:#1F2D24; --trait:#33463A;
  --ciel:#2A4250; --feuille:#5E8C3A; --feuille2:#7FA855; --tronc:#9A6A45; --sol:#6B4529;
  --seve:#6FA4E8; --fruit:#E0574C; --cache:#3E4E43; --accent:#6FA4E8; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--fond);color:var(--encre);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:18px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.part:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* ===== Projection ===== */
#projection{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:24px;height:100%;padding:20px 24px 70px}
#scene{width:100%;height:100%;max-height:calc(100vh - 100px)}
#panneau{align-self:center;background:var(--carte);border:2px solid var(--trait);border-radius:20px;padding:28px 30px;max-height:calc(100vh - 110px);overflow:auto}
#panneau h1{font-size:clamp(28px,3.2vw,46px);line-height:1.15;margin:0 0 6px}
#panneau .role{font-size:clamp(18px,1.6vw,24px);color:var(--doux);margin:0 0 20px}
#panneau .question{font-size:clamp(24px,2.4vw,36px);line-height:1.3;margin:0;border-left:6px solid var(--accent);padding-left:16px}
#panneau ul{list-style:none;padding:0;margin:8px 0 0}
#panneau li{font-size:clamp(19px,1.7vw,26px);padding:10px 0;border-bottom:1px solid var(--trait);display:flex;gap:12px;align-items:baseline}
#panneau li b{min-width:1.6em}
#panneau li span.q{display:block;color:var(--doux);font-size:.8em}

.part{cursor:pointer}
.part .forme{transition:opacity .4s, filter .4s}
.part .nom{font-weight:700;font-size:26px;fill:var(--encre);paint-order:stroke;stroke:var(--fond);stroke-width:6px;stroke-linejoin:round;transition:opacity .4s}
.part .badge{opacity:0;transition:opacity .3s}
.part.cache .forme{filter:grayscale(1);opacity:.28}
.part.cache .nom{opacity:0}
.part.cache .badge{opacity:1}
.part.actif .forme{filter:drop-shadow(0 0 7px var(--accent))}
.badge circle{fill:var(--carte);stroke:var(--doux);stroke-width:2}
.badge text{font-size:26px;font-weight:700;fill:var(--doux)}
@media (prefers-reduced-motion: no-preference){
  .seve-flux{stroke-dasharray:10 10;animation:flux 1.6s linear infinite}
  @keyframes flux{to{stroke-dashoffset:-40}}
}

#barre{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--fond);border-top:1px solid var(--trait);font-size:15px}
#barre button{background:var(--carte);border:1px solid var(--trait);border-radius:10px;padding:7px 12px}
#barre .etape{margin-left:auto;color:var(--doux)}

/* Notes sur le même écran */
#tiroir{position:fixed;left:16px;right:16px;bottom:62px;max-height:45vh;overflow:auto;background:var(--carte);border:2px solid var(--accent);border-radius:16px;padding:18px 22px;display:none;font-size:17px}
#tiroir.ouvert{display:block}

/* ===== Vue formateur ===== */
#formateur{display:none;max-width:1100px;margin:0 auto;padding:20px 24px 40px}
body.vue-formateur #projection, body.vue-formateur #barre, body.vue-formateur #tiroir{display:none}
body.vue-formateur #formateur{display:block}
body.vue-projection #barre, body.vue-projection #tiroir{display:none !important}
body.vue-projection #projection{height:100vh}
.pilotage{display:grid;gap:14px;margin-top:16px}.pilot-card{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:16px 18px}.pilot-card h2{font-size:18px;margin:0 0 10px}.flow{font-size:22px;font-weight:800;line-height:1.55}.reveal-grid{display:flex;flex-wrap:wrap;gap:8px}.reveal-grid button,.transition-btn{border:2px solid var(--accent);background:var(--carte);border-radius:12px;padding:10px 14px;font-size:17px;font-weight:800}.reveal-grid button.on{background:var(--accent);color:#fff}.mot-wrap{border:1px solid var(--trait);border-radius:12px;padding:10px 12px;background:var(--fond)}.mot-wrap .reveal-grid button{width:100%;text-align:left}.mot-aide{margin:7px 2px 0;color:var(--doux);font-size:16px;line-height:1.35}.avant-list{margin:6px 0 0;padding-left:20px}.avant-list li{margin:4px 0}.transition-btn{background:var(--accent);color:#fff;width:100%;font-size:19px}.detail-toggle{margin-top:8px}.details-hidden{display:none}
.f-tete{display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);background:var(--fond);padding:10px 0;border-bottom:2px solid var(--trait);z-index:2}
.f-tete h1{font-size:30px;margin:0 auto 0 0}
.f-tete button{background:var(--carte);border:2px solid var(--trait);border-radius:12px;padding:10px 16px;font-size:18px}
.f-tete button.fort{background:var(--accent);color:#fff;border-color:var(--accent)}
.f-etat{color:var(--doux);margin:10px 0 0}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.bloc{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:16px 18px}
.bloc h2{font-size:19px;margin:0 0 8px}
.bloc ul{margin:0;padding-left:20px}
.bloc li{margin:4px 0}
.bloc.dire{grid-column:1/-1;border-left:6px solid var(--accent)}
.bloc.dire li{font-size:21px}
.src{display:inline-block;font-size:13px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:6px;border:1px solid}
.src.c{color:#2E7D32;border-color:#2E7D32}.src.m{color:#8A5A36;border-color:#8A5A36}.src.r{color:#2F6DB5;border-color:#2F6DB5}.src.s{color:#7B4FA0;border-color:#7B4FA0}.src.p{color:#B06A10;border-color:#B06A10}.src.e{color:#5B6E5F;border-color:#5B6E5F}
.suite{margin-top:16px;color:var(--doux)}
.plan{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.plan button{background:var(--carte);border:1px solid var(--trait);border-radius:999px;padding:4px 12px;font-size:15px}
.plan button.vu{border-color:var(--accent)}
.plan button.ici{background:var(--accent);color:#fff;border-color:var(--accent)}

@media (max-width:820px){
  #projection{grid-template-columns:1fr;height:auto}
  #scene{max-height:60vh}
}

/* ===== Mode stagiaire : arbre de consultation ===== */
body.vue-stagiaire #barre,
body.vue-stagiaire #tiroir,
body.vue-stagiaire #formateur { display:none !important; }
body.vue-stagiaire #scene { min-height:auto; padding-bottom:24px; }
body.vue-stagiaire #panneau { max-height:none; overflow:visible; }
body.vue-stagiaire .part { cursor:pointer; }
body.vue-stagiaire .student-sheet{
  margin-top:14px;padding:14px 16px;border:1px solid var(--ligne);
  border-radius:14px;background:var(--fond2);
}
body.vue-stagiaire .student-sheet h2{font-size:1rem;margin:12px 0 6px}
body.vue-stagiaire .student-sheet ul{margin:6px 0 8px;padding-left:20px}
body.vue-stagiaire .student-sheet li{margin:5px 0}
body.vue-stagiaire .student-transition{
  margin:14px 0 4px;padding:12px 14px;border-left:4px solid var(--vert);
  border-radius:8px;background:rgba(98,212,155,.10);font-style:italic;
}
body.vue-stagiaire .student-help{
  text-align:center;margin:8px auto 14px;color:var(--texte2);font-size:.92rem;
}

#f-projecteur{display:inline-flex;align-items:center;text-decoration:none}
</style>
</head>

    titre:"Oiseaux : les clients", role:"Ils viennent autour de l’arbre, le font vivre et participent à la dissémination de ce qu’il produit.",

    rameaux:[["Où ?","Mon territoire : ville ou campagne ? jardins ? touristes ? concurrents ?"],["Qui ?","Pour qui l'alimentation a-t-elle du sens ?"],["Quelles attentes ?","Pourquoi viendraient-ils chez moi plutôt qu'au supermarché ?"],["Quelle relation ?","Comment un passant devient-il un fidèle ?"]],
    dire:["On s'installe là où est le marché. Produire ce que l'on vend, plutôt que vendre ce que l'on produit.","Les nouveaux clients sont moins militants qu'avant, mais sensibles au local.","Ils viennent pour la fraîcheur, les produits introuvables ailleurs, le conseil, la relation humaine. Et ils ont peu de temps pour cuisiner.","Du primo-acheteur au prescripteur : 5 étapes de relation.","Chaque année, 10 à 15 % des clients partent (déménagement, enfants qui partent...). Il faut les remplacer."],
    exemple:["Le maraîcher au journal : il lisait son journal derrière l'étal. Il l'a posé, a souri : ses ventes ont nettement augmenté.","Les 3 poules et les 300 œufs : 3 poules décoratives, 300 œufs achetés au voisin et vendus par jour. Les clients croyaient que tout venait de ces 3 poules. Ce qui est évident pour nous ne l'est pas pour le client.","Un mail « les fraises sont arrivées » attire une foule. Le même mail avec des rutabagas, beaucoup moins."],
    alerte:"Phrase choc de Charles : « Le maraîcher ne nourrit pas le monde. Il apporte du sens à l'alimentation. » À faire réagir, surtout ceux qui veulent « nourrir les gens ».",
    sources:[["c","Livret ch. 1 : structuration du raisonnement ; ch. 2 : définir une cible, percevoir les attentes, communication ciblée ; ch. 3 : habitudes de consommation"],["m","Guide MSV : choisir ses débouchés"],["s","Métaphore de l'arbre : François"]],
    transition:"Une fois le projet enraciné, la ferme ne se construit pas seule : elle doit rencontrer celles et ceux pour qui elle produira."
  },
  racines:{
    titre:"Racines : le projet personnel", role:"Ce qui tient l'arbre debout dans la tempête.",

    dire:["L'épanouissement personnel est la finalité première de la stratégie. Sans lui, on s'épuise.","Dans les 7 clés de la réussite du Guide MSV, les compétences techniques sont peu présentes.","Les 2 premières clés : la motivation et l'alignement."],

    sources:[["c","Livret ch. 1 : 4 questions (heures, vacances, salaire, seul ou à plusieurs)"],["m","Guide MSV 2022 : les 7 clés de la réussite"],["r","Approche globale (Bonneviale, Marshall) : le projet donne le sens"],["r","Thèse Dumont 2017 : revenu, temps, pénibilité, santé"]],

  sol:{

    dire:["C'est un triangle : physique, chimique, biologique. Lire son sol est au centre.","Les êtres vivants sont le moteur principal de la formation du sol (Gobat).","Hérody : on ne change pas la génétique d'un sol, on la gère au mieux.","Le terrain d'abord, le labo confirme."],
    exemple:["Brainstorm : « Qui fabrique le sol : la roche, le climat ou les êtres vivants ? » Puis révéler : les vivants.","Gobat : avec bactéries + protozoaires, la plante absorbe au moins 3 fois plus d'azote qu'avec les bactéries seules."],
    sources:[["r","Gobat, Aragno, Matthey, Le sol vivant (2010) : ch. 1 à 4, 6, 17, 18"],["m","Guide MSV 2022 : diagnostic, fertilité, biodiversité"],["p","Kinsey, Hands-On Agronomy : équilibre des cations, CEC"],["p","Méthode Hérody (résumé, à recouper avec le document 2003)"],["s","Triangle de la fertilité : module agronomie de François"]],
    alerte:"Débat des courants, dans « nourrir » : MSV nourrit la vie, Kinsey rééquilibre la chimie, Hérody comprend avant d'agir. Gobat sert d'arbitre universitaire.",

  ciel:{

    dire:["Une culture a besoin d'environ 1 000 mm d'eau par an, soit 20 mm par semaine.","L'irrigation fait passer d'un revenu qui rembourse les charges à un revenu qui paie un salaire.","80 % du chiffre d'affaires se fait sur 20 % de la surface, surtout sous abri. Viser 10 à 20 % couvert.","Le ciel apporte l'eau, le sol la retient (eau utile).","Rappeler l'exercice « chemin de l'eau » du module 1."],
    exemple:["Charles : réseau enterré, une sortie par serre et par carré. Les problèmes d'irrigation sont la 2e cause d'échec des cultures.","Kinsey : un sol bien nourri réduit les effets des aléas climatiques."],
    alerte:"Volumes d'eau : le Guide MSV donne environ 3 500 m³/ha en plein champ + 1 300 m³ pour 1 000 m² de serre ; Charles donne 1 500 à 2 000 m³ pour 1 ha dont 10 % sous abri, en Bretagne. Le climat local change tout : et chez nous, dans la Vienne ?",
    sources:[["m","Guide MSV 2022 : ordres de grandeur, irrigation, abris"],["c","Livret ch. 4 : stratégie de production"],["p","Kinsey, Hands-On Agronomy"],["r","Gobat, Le sol vivant : eau utile"]],
    transition:"Avec un sol et de l'eau, l'arbre peut monter. Il lui faut un tronc."

  tronc:{
    titre:"Tronc : la gamme", role:"Ce qui relie les clients à la production.",
    question:"Faut-il produire tous les légumes, toute l'année ?",
    rameaux:[["Pour qui ?","Paniers, marché ou vente à la ferme : ma gamme change-t-elle ?"],["Quoi ?","Légumes phares, secondaires ou trésors ?"],["Profondeur","Combien de produits je tire d'un seul légume ?"],["Quand ?","Quel produit star à chaque saison ?"],["Combien ?","Diversité cultivée ou diversité consommée ?"]],
    dire:["Chez Charles, la gamme est la moelle épinière : elle relie la vente et la production.","Environ 15 légumes font 70 à 80 % du chiffre d'affaires. Garder 2 à 4 légumes atypiques, bien accompagnés.","Une carotte = 8 produits (botte, lavée, couleur, apéro, jus...). La profondeur compte plus que le nombre.","Un produit star à chaque saison creuse (fraise au printemps, asperge, endive et mesclun en hiver) fait revenir les clients : on gagne sa vie sur 10 mois au lieu de 5 mois d'été.","Ne cultiver que ce que les clients achètent vraiment. Un légume vendu à moitié, c'est la moitié du travail perdue. Règle de Charles : chaque culture vendue à au moins 80 %."],
    exemple:["Une ferme passe de 60 à 36 légumes : 120 % du chiffre d'affaires et 3 mois de travail économisés.","Le fenouil vendu avec du thym, le miel du voisin et une recette : ventes en hausse.","Ail frais et tomate : environ 30 € par m² chacun, mais l'ail demande beaucoup moins de travail.","Le couple qui part en camping-car du 1er juillet au 25 août."],
    alerte:"Diversité : richesse ou piège ? Morel décrit des microfermes à 30-80 légumes, la diversité étant revendiquée (clients, autonomie, biodiversité, plaisir). Charles conseille de réduire la gamme pour la rendre efficace et lisible.",
    sources:[["c","Livret ch. 1, 2 et 3 ; vidéo VIII-5 Développer une gamme cohérente (+ transcription)"],["r","Morel et Léger : légumes clés et complémentaires"],["m","Guide MSV : cultures clés du marché"]],
    transition:"Du tronc partent les branches : les grands pôles de travail."

  branches:{

    dire:["Récolte, logistique et vente = 50 à 60 % du temps. La production est minoritaire.","Beaucoup s'installent pour produire et passent leur temps en post-récolte.","Un euro investi en post-production est souvent plus rentable qu'en production."],
    exemple:["Récolter à 30 €/h : 20 h pour un marché de 600 €. À 100 €/h : 6 h."],
    sources:[["c","Livret ch. 1 : répartition du temps de travail, études de cas"],["e","Chambre d'agriculture de la Loire : production 36 %, récolte et préparation 35 %, vente 30 % du temps"]],

  vente:{
    titre:"Branche Vente", role:"Transformer les légumes en revenu.",
    question:"Marché, vente à la ferme, paniers, magasins : lequel vous attire ? Pourquoi ?",
    rameaux:[["Où vendre ?","Marché, ferme, paniers, magasins : lequel me va ?"],["Combien de temps ?","Quelle part de ma semaine je passe à vendre ?"],["Quel objectif ?","Combien dois-je vendre à chaque vente ?"],["Se faire connaître ?","Comment les clients me trouvent et me reconnaissent ?"]],
    dire:["Le test des 3 questions de Charles : je m'y sens bien ? ma ferme le permet ? c'est rentable ? Aller voir un marché en février, pas seulement en juin.","Si je vends 10 % de mon temps, 1 heure de vente doit payer 10 heures de travail. Bon équilibre : 10 à 20 % du temps.","40 000 € par an / 50 semaines = 800 € à vendre par semaine. Mieux vaut 1 ou 2 bonnes ventes que 4 marchés à 100 €.","Sans image, le client ne compare que le prix.","Les chiffres de Charles et ceux des études se rejoignent : la vente seule = environ 16 % du temps. Avec préparation et transport : jusqu'à 30 %."],
    exemple:["Un maraîcher en traction animale l'écrivait sur une petite feuille A4. Avec une bâche photo, sa clientèle a été multipliée par 2 ou 3.","Le maraîcher au journal : il l'a posé, a souri, ses ventes ont augmenté."],
    alerte:"Un seul gros marché ou plusieurs petits ? Charles : trop de lieux de vente dilue les ventes. Navarrete et Morel : les circuits façonnent toute la ferme. « Choisir où vendre, c'est déjà choisir sa ferme. »",
    sources:[["c","Livret ch. 1 et 2 : poids de la vente, schéma en 3 étapes, communication"],["m","Guide MSV : commercialisation, objectif de 800 € par semaine"],["r","Navarrete (INRA) : circuits et diversité des systèmes maraîchers bio"],["r","Morel et Léger 2016 : choix stratégiques de 14 microfermes"],["e","Guide circuits courts : vente 16 % en moyenne, commercialisation 14 à 30 %"],["e","Chambre d'agriculture BFC : préparation + vente = 25 % du temps"]],
    transition:"Pour vendre, il faut produire. Passons à la production."

  production:{
    titre:"Branche Production", role:"Faire pousser les légumes.",
    question:"Si vous aviez 30 000 € pour démarrer, dans quoi investiriez-vous en premier ?",
    rameaux:[["Abris","Combien de serres ? Où ?"],["Design / standardiser","Comment organiser planches, serres, bâtiments et circulations pour travailler simplement ?"],["Semer, planter, désherber","Comment gagner du temps à chaque geste ?"],["Planifier","Comment gérer 200 séries par an ?"],["Mécaniser ?","Tracteur ou pas ?"]],
    dire:["Sous abri : 20 à 30 €/m², dehors : 2 à 10 €/m². 2 à 2,5 cultures par an sous abri, contre 1 à 1,5 dehors.","L'ordre des investissements selon Charles : 1. abris, 2. irrigation, 3. désherbage, 4. motorisation, 5. confort. Chaque investissement doit financer le suivant.","Même longueur de planches et mêmes écartements : mêmes bâches, voiles, goutte-à-goutte.","Désherber tôt : 15 minutes à la bonne semaine, 30 minutes une semaine plus tard, 2 heures si on attend encore.","Morel et Léger : regrouper les cultures par famille, saison, besoin en eau ou en fertilité. Les 12 fermes étudiées le font."],
    exemple:["Guide MSV, « si c'était à refaire » : 3 fermes disent qu'elles homogénéiseraient tout de suite leurs planches. D'autres : « moins de diversification au démarrage », « démarrer moins vite », « ne pas s'installer tout seul ».","Morel : un semoir manuel permet jusqu'à 12 rangs sur une planche de 80 cm, contre 3 en maraîchage motorisé.","Morel (modèle MERLIN) : dans les scénarios viables, 29 à 31 % de la surface est sous serre en systèmes manuel et biointensif, 19 % en système mécanisé. Plus que les 10-20 % souvent conseillés."],
    alerte:"Tracteur : liberté ou piège ? Morel décrit des microfermes à haute intensité, à la main. Charles fait de la motorisation un levier de confort et de logistique (3 niveaux, penser à 4-5 ans).",
    sources:[["c","Livret ch. 4 : stratégie de production ; vidéos IV-1 à IV-12 (+ transcriptions)"],["m","Guide MSV 2022 : installation, abris, revenu horaire par légume, « si c'était à refaire »"],["r","Thèse Morel 2016, article 3 (MERLIN) et article 4 (Morel et Léger 2015, planification)"],["r","Morel et Senil 2018 : design d'une microferme"]],
    transition:"Une fois produits, les légumes doivent être récoltés."
  },
  recolte:{
    titre:"Branche Récolte", role:"Souvent 30 à 40 % du temps de travail.",
    question:"Combien d'heures pour récolter un marché de 1 000 € ?",
    rameaux:[["Combien de temps ?","Quelle part de la semaine passe à récolter ?"],["Combien par heure ?","Combien je gagne en une heure de récolte ?"],["Quand ?","Pourquoi récolter la veille ou le jour de la vente ?"],["Avec quoi ?","Main, chariot ou machine ?"],["Quels légumes ?","Quels légumes coûtent le plus en récolte ?"]],
    dire:["La récolte prend souvent 30 à 40 % du temps de travail.","Le calcul : € par heure de récolte = valeur de vente des légumes récoltés / heures passées à récolter.","Repère de Charles, observé sur les fermes efficaces : 60 à 100 € par heure de récolte. En dessous de 60-70 €, l'organisation est à revoir.","Guide MSV : viser au moins 50 €/h pour payer l'implantation, le suivi, la vente et l'administratif. Ce sont 2 repères différents : un minimum (MSV) et un niveau d'efficacité (Charles).","Pour progresser : préparer les chantiers, créer des zones de récolte, réduire les charges portées."],
    exemple:["Marché de 1 000 € : à 50 €/h, 20 heures de récolte. À 100 €/h, 10 heures.","Haricots (Guide MSV) : 2 kg récoltés en 1 heure x 8 €/kg = 16 €/h seulement.","Agrobio Bretagne : de 20 à 120 bottes de radis par heure selon les maraîchers. Jusqu'à 6 fois plus rapide pour la même tâche.","Investissement en escalier (pommes de terre, Charles) : fourche 20 €, lame souleveuse 4-5 000 €, arracheuse à tapis 15 000 €, arracheuse par les fanes 25 000 €. À chaque marche, il faut plus de surface.","Thèse Morel : une microferme a retiré haricots et petits pois de ses paniers, car ses clients en avaient au jardin et leur récolte prend beaucoup de temps."],
    sources:[["c","Livret ch. 1 et 5 ; vidéos I-5, V-4 et VIII-7 (+ transcriptions)"],["m","Guide MSV : ordres de grandeur, rentabilité des itinéraires, conservation"],["r","Thèse Morel 2016 : charge de travail par culture, cas d'une microferme"],["e","Agrobio Bretagne : temps de travail en maraîchage"],["e","Chambre d'agriculture de la Loire : récolte, tri et préparation = 35 % du temps"]],
    transition:"Qui fait tout ce travail ? La main-d'œuvre."
  },
  mo:{
    titre:"Branche Main-d'œuvre", role:"Associés, salariés, stagiaires, bénévoles.",
    question:"Combien de temps passeriez-vous pour choisir un salarié ? Et pour acheter un outil à 2 500 € ?",
    rameaux:[["Seul ou à plusieurs ?","Associé, salarié, stagiaire, bénévole ?"],["Pourquoi embaucher ?","Pour produire plus ou pour souffler ?"],["Bien recruter","Fiche de poste, puis entretien d'embauche"],["Organiser","Comment le salarié sait quoi faire sans me demander ?"],["Faire grandir","Comment garder un bon salarié ?"]],
    dire:["Embaucher, c'est changer de métier : devenir manager. Déléguer, accepter que ce soit fait différemment.","Deux objectifs : économique (produire et vendre plus) et humain (vacances, charge mentale, pénibilité).","Fiche de poste d'abord : pourquoi embaucher, quelles tâches prioritaires. Ne pas déléguer seulement ce qu'on n'aime pas.","Procédures orales, visuelles, écrites. Un grand tableau visible de tous. Préparer les chantiers la veille.","Réunion d'équipe chaque semaine, entretien annuel, petits projets confiés.","Souvent, le problème vient du système, pas du salarié."],
    exemple:["L'épandeur et le saisonnier : 3 jours pour acheter un épandeur à 2 500 €, et 5 minutes pour embaucher un saisonnier à 12 000 €.","Les fraises trop lentes : le problème venait du rang du milieu inaccessible. Écart normal entre salarié et patron : environ 10 %.","Les vannes : procédure trop compliquée. Solution : codes couleurs sur les vannes et petit livret.","Deux associés ont structuré leur ferme avec des procédures claires : ils partent maintenant en vacances ensemble, même l'été.","Thèse Morel : sur 14 microfermes, 3 seulement ont des salariés. Les stagiaires apportent jusqu'à 33 % du travail."],
    alerte:"La main-d'œuvre gratuite est-elle vraiment gratuite ? Morel : stagiaires et bénévoles demandent de l'énergie pour former sans cesse, avec beaucoup de turnover. Charles : un salarié formé et autonome est un vrai poste à construire. Lien avec la formation : tableaux et procédures visuelles aident aussi les personnes dys et TDAH.",
    sources:[["c","Livret ch. 7 : introduction et accompagnement de la main-d'œuvre"],["r","Thèse Morel 2016, articles 2 et 5 : main-d'œuvre, stagiaires, bénévoles"],["m","Guide MSV : « si c'était à refaire », ne pas s'installer seul"]],
    transition:"Pour que les branches vivent, il faut que la sève circule."
  },
  seve:{
    titre:"Sève : les flux et la logistique", role:"Faire circuler les produits, les moyens et les informations avec le moins de reprises inutiles possible.",
    question:"Entre la récolte et le départ chez le client, combien de fois déplacez-vous, posez-vous et reprenez-vous une même caisse ?",
    rameaux:[["Faire circuler","Comment le légume va-t-il du champ au client ?"],["Porter moins","Combien de fois prend-on, pose-t-on et reprend-on la même caisse ?"],["Préparer / stocker","Où laver, trier, conditionner et conserver sans revenir en arrière ?"],["Faire circuler l'information","Comment chacun sait-il quoi récolter, laver et préparer ?"],["Dimensionner / évoluer","Cette organisation fonctionnera-t-elle encore avec plus de volume ou plus de personnes ?"]],
    dire:["La logistique est le trait d'union entre production et vente.","Marche en avant : le produit avance du sale vers le propre et vers l'expédition sans croisements ni retours inutiles.","20 tonnes portées 20 fois = 400 tonnes manipulées par an : poids × reprises × répétition.","Le produit circule ET l'information circule : les commandes et consignes ne doivent pas rester dans la tête d'une seule personne.","Une bonne logistique ne cherche pas seulement à faire plus vite. Elle cherche d'abord à supprimer ce qui n'a pas besoin d'être fait."],
    exemple:["Diagramme spaghetti : tracer le trajet réel d'une salade du champ au véhicule, puis chercher un déplacement à supprimer.","Chariot, micro-palette, standardisation des caisses et rampe : des outils simples peuvent supprimer des ports et des reprises.","Une zone de préparation organisée en marche en avant : arrivée sale → lavage/parage → conditionnement → stockage propre → expédition."],
    alerte:"Un trajet long n'est pas forcément mauvais : interroger surtout les retours en arrière, croisements, attentes et reprises inutiles.",
    sources:[["c","Charles Souillot, livret ch. 5 et vidéos V-1 à V-5 : marche en avant, flux, charges portées, information"],["r","Ben Hartman, The Lean Farm / The Lean Micro Farm : supprimer les gaspillages et raccourcir les flux"],["s","Module 1 TEA : diagramme spaghetti et exercice des charges portées"]],
    transition:"Quand les flux sont organisés, on peut regarder ce que l'ensemble de la ferme produit réellement : ses fruits."
  },
  fruits:{
    titre:"Fruits : les résultats", role:"Ce que la ferme donne réellement au maraîcher.",
    question:"À quoi reconnaît-on qu'une ferme fonctionne bien ?",
    rameaux:[["Revenu","Est-ce que la ferme permet de vivre ?"],["Temps","Combien d'heures faut-il pour obtenir ce revenu ?"],["Santé","Peut-on travailler comme cela pendant 10, 20 ou 30 ans ?"],["Sens / qualité de vie","Cette ferme correspond-elle à la vie que je voulais ?"],["Solidité","Le système peut-il encaisser une mauvaise année ou un changement ?"]],
    dire:["Chiffre d'affaires et revenu ne sont pas la même chose.","Le revenu seul ne suffit pas : il faut le mettre en face du temps nécessaire pour le produire.","La santé et la pénibilité font partie du résultat du système, pas seulement du confort.","La réussite d'une ferme ne peut pas être jugée uniquement par l'économie : viabilité et vivabilité doivent être regardées ensemble.","Question centrale : les fruits que produit ma ferme correspondent-ils aux racines de mon projet ?"],
    exemple:["Deux fermes peuvent avoir des chiffres d'affaires différents et pourtant répondre différemment aux objectifs de revenu, temps, santé et qualité de vie de leurs maraîchers."],
    alerte:"Ne pas chercher un modèle unique de ferme réussie : le résultat doit être comparé au projet personnel et professionnel.",
    sources:[["r","Kevin Morel, thèse 2016 : viabilité sociale et économique des microfermes"],["r","Antoinette Dumont 2017 : revenu, sécurité, temps de travail, pénibilité, santé, marge de manœuvre"],["m","Guide MSV 2022 : alignement projet personnel/professionnel, CA, marge, temps et revenu horaire"],["c","Charles Souillot, livret ch. 1 : projet, revenu, temps et évolution de la ferme"]],
    transition:"Les fruits dépendent aussi de ce qui se passe autour de l'arbre."
  },
  animaux:{
    titre:"Environnement : le contexte", role:"Ce qui agit sur la ferme sans être totalement maîtrisable.",
    question:"Deux fermes identiques dans deux territoires différents auront-elles les mêmes résultats ?",
    rameaux:[["Marché","Y a-t-il suffisamment de clients pour ce que je veux vendre ?"],["Territoire","Qu'est-ce que ma localisation permet ou contraint ?"],["Climat / ressources","À quels aléas et ressources suis-je exposé ?"],["Écosystème humain","Avec qui puis-je travailler plutôt que rester seul ?"],["Cadre extérieur","Quelles règles et évolutions peuvent modifier mon système ?"]],

/* ---------- État ---------- */
const CLE = "arbre-tea-etat";
let etat = {etats:Object.fromEntries(ORDRE.map(k=>[k,0])), actif:null, mots:{}};
let canal=null;
try{ if("BroadcastChannel" in window) canal=new BroadcastChannel("arbre-tea"); }catch(_){ canal=null; }

function charger(){ try{ const v = localStorage.getItem(CLE); if(v){ const e = JSON.parse(v); if(e && e.etats){ etat = e; if(!etat.mots) etat.mots={}; } } }catch(_){ } }
function diffuser(){
  try{ localStorage.setItem(CLE, JSON.stringify(etat)); }catch(_){ }
  try{ canal && canal.postMessage(etat); }catch(_){ }
}
function recevoir(e){ if(e && e.etats){ etat = e; if(!etat.mots) etat.mots={}; afficher(); } }
if(canal) canal.onmessage = ev => recevoir(ev.data);
window.addEventListener("storage", ev => { if(ev.key===CLE && ev.newValue){ try{ recevoir(JSON.parse(ev.newValue)); }catch(_){ } } });

function changer(fn){ fn(); afficher(); diffuser(); }

function suivant(){ changer(()=>{
  for(const k of ORDRE){ if(etat.etats[k]<2){ etat.etats[k]++; etat.actif=k; return; } }
});}
function precedent(){ changer(()=>{
  for(let i=ORDRE.length-1;i>=0;i--){ const k=ORDRE[i];
    if(etat.etats[k]>0){ etat.etats[k]--;
      if(etat.etats[k]>0){ etat.actif=k; }
      else { const avant = ORDRE.slice(0,i).reverse().find(x=>etat.etats[x]>0); etat.actif = avant||null; }
      return; } }
});}
function cliquer(k){ changer(()=>{ if(etat.etats[k]<2 && (etat.actif===k || etat.etats[k]===0)) etat.etats[k]++; etat.actif=k; }); }
function toutReveler(){ changer(()=>{ ORDRE.forEach(k=>etat.etats[k]=2); etat.actif=null; }); }
function recommencer(){ changer(()=>{ ORDRE.forEach(k=>etat.etats[k]=0); etat.actif=null; etat.mots={}; }); }

  let special="";
  if(d.special) special=`<div class="pilot-card"><h2>Révélation libre</h2><div class="reveal-grid">${d.special.map(x=>`<button data-reveal="${x}" class="${etat.etats[x]>0?'on':''}">${esc(P[x].titre.split(' :')[0])}</button>`).join('')}</div></div>`;
  el.innerHTML=`<div class="pilot-card"><h2>❓ Question</h2><div class="flow">${esc(d.q)}</div></div>${avant}<div class="pilot-card"><h2>🔎 Faire émerger</h2><div style="display:grid;gap:8px">${mots}</div></div><div class="pilot-card"><h2>🧠 Synthèse</h2><div class="flow">${esc(d.idee)}</div></div>${special}<div class="pilot-card"><h2>🔗 Transition</h2><div class="flow">${esc(d.trans)}</div></div><button class="transition-btn" data-transition="${d.next||''}">${esc(d.label)}</button>`;
}

function afficher(){
  if(EST_STAGIAIRE){ afficherStagiaire(); return; }
  ORDRE.forEach(k=>{
    const g = document.querySelector(`.part[data-part="${k}"]`);
    g.classList.toggle("cache", etat.etats[k]===0);
    g.classList.toggle("actif", etat.actif===k);
  });
  afficherPanneau();
  document.getElementById("etape").textContent = etapeTexte();
  document.getElementById("tiroir").innerHTML = notesHTML(etat.actif);

  const k = etat.actif;
  document.getElementById("f-titre").textContent = k ? P[k].titre : P.intro.titre;
  const n = k ? etat.etats[k] : 0;
  document.getElementById("f-etat").textContent = etapeTexte() + (k ? (n===1 ? " · à l'écran : la question" : " · à l'écran : les rameaux") : "");
  document.getElementById("f-notes").innerHTML = notesHTML(k);
  afficherPilotage(k);
  const prochain = ORDRE.find(x=>etat.etats[x]<2);
  document.getElementById("f-suite").textContent = prochain ? ("Prochaine étape : " + (etat.etats[prochain]===0 ? "révéler " : "dérouler ") + P[prochain].titre) : "Tout est révélé.";
  document.getElementById("f-plan").innerHTML = ORDRE.map(x=>`<button data-aller="${x}" class="${etat.etats[x]===2?'vu':''} ${etat.actif===x?'ici':''}">${esc(P[x].titre.split(" :")[0])}</button>`).join("");
}

/* ---------- Commandes ---------- */
document.querySelectorAll(".part").forEach(g=>{
  const choisir=()=>{
    if(EST_STAGIAIRE){ etat.actif=g.dataset.part; afficherStagiaire(); }
    else cliquer(g.dataset.part);
  };
  g.addEventListener("click", choisir);
  g.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); choisir(); } });
});
document.getElementById("b-suiv").onclick = suivant;
document.getElementById("b-prec").onclick = precedent;
document.getElementById("f-suiv").onclick = suivant;
document.getElementById("f-projecteur").addEventListener("click", ()=>{
  // L’état courant est déjà synchronisé par diffuser().
  // Ne rien exécuter ici : le lien natif ouvre la vue projection.
});
document.getElementById("f-prec").onclick = precedent;
document.getElementById("b-tout").onclick = toutReveler;
document.getElementById("b-zero").onclick = recommencer;
document.getElementById("b-notes").onclick = ()=>document.getElementById("tiroir").classList.toggle("ouvert");
document.getElementById("b-ouvrir").onclick = ()=>{
  const u = new URL(window.location.href); u.search = "?vue=formateur"; u.hash = "";
  const w = window.open(u.href, "arbre-formateur");
  if(!w){ document.getElementById("tiroir").classList.add("ouvert"); }
};
document.getElementById("f-plan").addEventListener("click", e=>{
  const b = e.target.closest("button[data-aller]"); if(!b) return;
  changer(()=>{ const k=b.dataset.aller; if(etat.etats[k]===0) etat.etats[k]=1; etat.actif=k; });
});
document.getElementById("f-pilotage").addEventListener("click",e=>{
  const m=e.target.closest("[data-mot]"); if(m && etat.actif){ basculerMot(etat.actif,m.dataset.mot); return; }
  const r=e.target.closest("[data-reveal]"); if(r){revelerDepuisPupitre(r.dataset.reveal);return;}
  const t=e.target.closest("[data-transition]"); if(!t)return;
  const next=t.dataset.transition;
  if(next){revelerDepuisPupitre(next);} else {toutReveler(); etat.actif=null; afficher(); diffuser();}
});
document.getElementById("f-details-toggle").onclick=()=>document.getElementById("f-notes").classList.toggle("details-hidden");

document.addEventListener("keydown", e=>{
  if(e.target.closest && e.target.closest(".part")) return;
  if(e.key==="ArrowRight" || e.key===" " || e.key==="PageDown"){ e.preventDefault(); suivant(); }
  else if(e.key==="ArrowLeft" || e.key==="PageUp"){ e.preventDefault(); precedent(); }
  else if(e.key==="n" || e.key==="N"){ document.getElementById("tiroir").classList.toggle("ouvert"); }
});

if(MODE==="formateur") document.body.classList.add("vue-formateur");
if(MODE==="projection") document.body.classList.add("vue-projection");
if(EST_STAGIAIRE){
  document.body.classList.add("vue-stagiaire");
  etat={etats:Object.fromEntries(ORDRE.map(k=>[k,2])),actif:null,mots:{}};
}else{
  charger();
}
afficher();
</script>
</body>
</html>
